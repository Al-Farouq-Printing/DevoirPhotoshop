
name: Build DevoirPhotoshop APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Remove local Termux AAPT2 override
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/android.aapt2FromMavenOverride=/d' gradle.properties
          fi

      - name: Build Debug APK
        run: |
          ./gradle-8.7/bin/gradle --no-daemon --max-workers=2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevoirPhotoshop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

